<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edu Food</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/listausuarios.css">
</head>

<body>

    <nav class="navbar navbar-expand-lg navbar-custom">

        <div class="container">

            <a class="navbar-brand titulo" href="#">
                Edu Food
            </a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">

                <span class="navbar-toggler-icon"></span>

            </button>

            <div class="collapse navbar-collapse justify-content-end" id="menu">

                <div class="navbar-nav">

                    <a class="nav-link" href="#">
                        Inicio
                    </a>

                    <a class="nav-link" href="#">
                        Estudiantes
                    </a>
                </div>
            </div>
        </div>
    </nav>

    
    <main class="container my-5">

        <div class="lista-box shadow-lg">

            <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-3">

                <h1 class="titulo-lista">
                    Lista de estudiantes
                </h1>

                <button class="btn btn-agregar">
                    + Agregar estudiante
                </button>

            </div>

            <div class="mb-4">

                <input type="text"
                    class="form-control buscador"
                    placeholder="Buscar estudiante...">

            </div>

       
            <div class="table-responsive">

                <table class="table table-hover align-middle text-center">

                    <thead class="tabla-header">

                        <tr>

                            <th>Numero de Usuario</th>
                            <th>Nombre</th>
                            <th>Correo</th>
                            <th>Curso</th>
                            <th>Estado</th>
                            <th>Acciones</th>

                        </tr>

                    </thead>

                    <tbody>

                        <tr>

                            <td>001</td>
                            <td>Angie Bastidas</td>
                            <td>angie@gmail.com</td>
                            <td>11°</td>

                            <td>
                                <span class="badge bg-success">
                                    Activo
                                </span>
                            </td>
                        </tr>

                        <tr>

                            <td>002</td>
                            <td>Valentina Lopez</td>
                            <td>valentina@gmail.com</td>
                            <td>11°</td>

                            <td>
                                <span class="badge bg-success">
                                    Activo
                                </span>
                            </td>

                            <td>

                                <button class="btn btn-sm btn-primary">
                                    Editar
                                </button>

                                <button class="btn btn-sm btn-danger">
                                    Eliminar
                                </button>

                            </td>

                        </tr>

                        <tr>

                            <td>003</td>
                            <td>Mateo Vasquez</td>
                            <td>mateo@gmail.com</td>
                            <td>10°</td>

                            <td>
                                <span class="badge bg-warning text-dark">
                                    Pendiente
                                </span>
                            </td>

                            <td>

                                <button class="btn btn-sm btn-primary">
                                    Editar
                                </button>

                                <button class="btn btn-sm btn-danger">
                                    Eliminar
                                </button>

                            </td>

                        </tr>

                    </tbody>

                </table>

            </div>

        </div>

    </main>
    <footer class="footer-custom">

        <p>
            © Edu Food 2026
        </p>

    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
