<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edu Food - Inicio de sesión</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/styles.css">
</head>

<body class="bg-light-purple">

    <!-- navbar -->
    <nav class="navbar navbar-expand-lg navbar-custom">
        <div class="container">
            <a class="navbar-brand titulo d-flex align-items-center gap-2" href="../index.html">
                <img src="../imagenes/plato-removebg-preview.png" alt="Logo Edu Food" style="height: 40px; width: 40px; object-fit: cover; border-radius: 50%;">
                Edu Food
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse justify-content-end" id="menu">
                <div class="navbar-nav">
                    <a class="nav-link" href="../index.html">Inicio</a>
                    <a class="nav-link" href="./acercadenosotros.html">Acerca de nosotros</a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Formulario de Inicio de Sesión -->
    <main class="container my-5">
        <h1 class="text-center fw-bold text-grafito mb-4">INICIO DE SESIÓN</h1>

        <form>
            <label for="correo">Correo</label>
            <input type="email" id="correo" placeholder="correo..." required>

            <label for="password">Contraseña</label>
            <input type="password" id="password" placeholder="contraseña..." required>

            <label for="tipo">Tipo de ingresante</label>
            <select id="tipo">
                <option value="estudiante">Estudiante</option>
                <option value="administrador">Administrador</option>
            </select>

            <button type="submit" class="submit-btn">Enviar</button>
        </form>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
