<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edu Food - Gestión de Refrigerios Admin</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body class="bg-light-purple">

<body class="bg-light-purple d-flex flex-column min-vh-100">

    <!-- Barra de Navegación -->
    <header>
        <nav class="navbar navbar-expand-lg">
            <div class="container-fluid">
                <h1 class="text-white ms-3 mb-0 fs-3">Edu Food</h1>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <div class="navbar-nav ms-auto links-navinad align-items-center gap-3">
                        <a class="nav-link text-white active" href="./inadministrador.html">Inicio</a>
                        <a class="nav-link text-white" href="./listausuarios.html">lista de usuarios</a>
                        <a class="nav-link text-white" href="./acercadenosotrosadmin.html">Acerca de nosotros</a>
                        <!-- Icono de perfil de administrador -->
                        <a href="./configuracionadmin.html" class="profile-icon text-white">
                            <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" fill="currentColor"
                                class="bi bi-person-circle" viewBox="0 0 16 16">
                                <path d="M11 6a3 3 0 1 1-6 0 3 3 0 0 1 6 0" />
                                <path fill-rule="evenodd"
                                    d="M0 8a8 8 0 1 1 16 0A8 8 0 0 1 0 8m8-7a7 7 0 0 0-5.468 11.37C3.242 11.226 4.805 10 8 10s4.757 1.225 5.468 2.37A7 7 0 0 0 8 1" />
                            </svg>
                        </a>
                    </div>
                </div>

            </div>
        </div>
    </nav>
    </header>

    <!-- Contenido Principal / Panel de Administración de Refrigerios -->
    <main class="container my-5 flex-grow-1">
        <div class="text-center mb-5">
            <h1 class="fw-bold text-grafito">Gestión de Refrigerios Escolares</h1>
            <p class="text-muted">Actualiza y configura los refrigerios diarios disponibles para los estudiantes.</p>
        </div>

        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                <div class="main-card shadow-lg p-4">
                    <h3 class="text-center fw-bold mb-4 text-grafito">Modificar Refrigerio</h3>
                    
                    <form style="width: 100%; max-width: 100%; margin: 0; padding: 0; background: transparent; box-shadow: none; border-top: none;">
                        <div class="mb-3">
                            <label for="nombreRefrigerio" class="form-label text-grafito fw-bold">Nombre del Refrigerio</label>
                            <input type="text" id="nombreRefrigerio" class="form-control custom-input" placeholder="Ej: Fruta y Jugo Natural..." required>
                        </div>

                        <div class="mb-3">
                            <label for="descripcionRefrigerio" class="form-label text-grafito fw-bold">Descripción del Menú</label>
                            <input type="text" id="descripcionRefrigerio" class="form-control custom-input" placeholder="Detalle los componentes del refrigerio..." required>
                        </div>

                        <div class="mb-3">
                            <label for="imagenRefrigerio" class="form-label text-grafito fw-bold">Imagen del Refrigerio</label>
                            <input type="file" id="imagenRefrigerio" class="form-control custom-input">
                        </div>

                        <button type="submit" class="submit-btn mt-4">Guardar Cambios</button>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="custom-footer mt-auto">
        <p class="m-0">© 2026 Restaurante Escolar Edu Food. Todos los derechos reservados.</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
