<!DOCTYPE html>
<html lang="es">

<head>
   <!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edu Food</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="../css/anadirplato.css">
</head>

<body>

    <!-- NAVBAR -->
    <header>

        <nav class="navbar navbar-expand-lg navbar-light custom-navbar px-4 py-3">

            <div class="container-fluid">

                <a class="navbar-brand fw-bold logo" href="#">
                    Edu Food
                </a>

                <button class="navbar-toggler border-0 shadow-none"
                    type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#menu">

                    <span class="navbar-toggler-icon"></span>

                </button>

                <div class="collapse navbar-collapse justify-content-between" id="menu">

                    <ul class="navbar-nav mx-auto gap-lg-4 text-center">

                        <li class="nav-item">
                            <a class="nav-link" href="/index.html">
                                Inicio
                            </a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link" href="paginadeplatosadmin.html">
                                Platos
                            </a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link" href="./refrigerioadmin.html">
                                Refrigerios
                            </a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link" href="./acercadenosotrosadmin.html">
                                Nosotros
                            </a>
                        </li>

                    </ul>

                </div>

            </div>

        </nav>

    </header>

    <!-- CONTENIDO -->
    <main class="container py-5">

        <div class="main-card">

            <div class="row g-4 align-items-center">

                <!-- FORMULARIO -->
                <div class="col-lg-7">

                    <div class="form-card">

                        <h1 class="title mt-3">
                            Añadir Nuevo Plato o Refrigerio
                        </h1>

                        <p class="description">
                            Registra un nuevo plato o refrigerio saludable para el menú escolar.
                            Completa toda la información correctamente.
                        </p>

                        <form class="row g-3 mt-2">

                            <div class="col-md-6">

                                <label class="form-label">
                                    Nombre del plato
                                </label>

                                <input type="text"
                                    class="form-control custom-input"
                                    placeholder="Ej: Hamburguesa saludable">

                            </div>

                            <div class="col-md-6">

                                <label class="form-label">
                                    Categoría
                                </label>

                                <select class="form-select custom-input">

                                    <option selected>
                                        Seleccionar
                                    </option>

                                    <option>
                                        Almuerzo
                                    </option>

                                    <option>
                                        Refrigerio
                                    </option>

                                </select>

                            </div>

                            <div class="col-12">

                                <label class="form-label">
                                    Descripción
                                </label>

                                <textarea rows="4"
                                    class="form-control custom-input"
                                    placeholder="Describe el plato..."></textarea>

                            </div>

                            <div class="col-md-4">

                                <label class="form-label">
                                    Calorías
                                </label>

                                <input type="number"
                                    class="form-control custom-input"
                                    placeholder="320">

                            </div>

                            <div class="col-md-4">

                                <label class="form-label">
                                    Proteínas
                                </label>

                                <input type="text"
                                    class="form-control custom-input"
                                    placeholder="20g">

                            </div>

                            <div class="col-md-4">

                                <label class="form-label">
                                    Grasas
                                </label>

                                <input type="text"
                                    class="form-control custom-input"
                                    placeholder="10g">

                            </div>

                            <div class="col-12">

                                <label class="form-label">
                                    Imagen del plato
                                </label>

                                <input type="file"
                                    class="form-control custom-input">

                            </div>

                            <div class="col-12 mt-4">

                                <button class="btn submit-btn w-100">

                                    Guardar Plato

                                </button>

                            </div>

                        </form>

                    </div>

                </div>

                <!-- IMÁGENES -->
                <div class="col-lg-5">

                    <div class="row g-3">

                        <div class="col-sm-6">

                            <div class="food-card">

                                <img src="https://images.unsplash.com/photo-1568901346375-23c9450c58cd?q=80&w=800&auto=format&fit=crop"
                                    alt="Hamburguesa">

                            </div>

                        </div>

                        <div class="col-sm-6">

                            <div class="food-card">

                                <img src="https://images.unsplash.com/photo-1550547660-d9450f859349?q=80&w=800&auto=format&fit=crop"
                                    alt="Hamburguesa">

                            </div>

                        </div>

                        <div class="col-sm-6">

                            <div class="food-card">

                                <img src="https://images.unsplash.com/photo-1546069901-ba9599a7e63c?q=80&w=800&auto=format&fit=crop"
                                    alt="Ensalada">

                            </div>

                        </div>

                        <div class="col-sm-6">

                            <div class="food-card">

                                <img src="https://images.unsplash.com/photo-1512621776951-a57141f2eefd?q=80&w=800&auto=format&fit=crop"
                                    alt="Comida saludable">

                            </div>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </main>

    <!-- Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
