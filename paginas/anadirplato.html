<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edu Food - Añadir Plato</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/styles.css">
</head>

<body class="bg-light-purple d-flex flex-column min-vh-100">

    <!-- Barra de Navegación -->
    <nav class="navbar navbar-expand-lg navbar-custom">
        <div class="container">
            <a class="navbar-brand titulo d-flex align-items-center gap-2" href="./inadministrador.html">
                <img src="../imagenes/plato-removebg-preview.png" alt="Logo Edu Food" style="height: 40px; width: 40px; object-fit: cover; border-radius: 50%;">
                Edu Food
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse justify-content-end" id="menu">
                <div class="navbar-nav">
                    <a class="nav-link" href="./inadministrador.html">Inicio</a>
                    <a class="nav-link" href="./paginadeplatosadmin.html">Modificar Platos</a>
                    <a class="nav-link" href="./acercadenosotrosadmin.html">Acerca de nosotros</a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Contenido Principal / Formulario -->
    <main class="container my-5 flex-grow-1">
        <div class="text-center mb-4">
            <h1 class="fw-bold text-grafito">Añadir Nuevo Plato o Refrigerio</h1>
            <p class="text-muted">Completa los datos para registrar un nuevo elemento en el sistema.</p>
        </div>

        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                <div class="main-card shadow-lg p-4">
                    <h3 class="text-center fw-bold mb-4 text-grafito">Registrar Elemento</h3>
                    
                    <form style="width: 100%; max-width: 100%; margin: 0; padding: 0; background: transparent; box-shadow: none; border-top: none;">
                        <div class="mb-3">
                            <label for="nombrePlato" class="form-label text-grafito fw-bold">Nombre del plato</label>
                            <input type="text" id="nombrePlato" class="form-control custom-input" placeholder="Ej: Hamburguesa saludable" required>
                        </div>

                        <div class="mb-3">
                            <label for="descripcionPlato" class="form-label text-grafito fw-bold">Descripción</label>
                            <input type="text" id="descripcionPlato" class="form-control custom-input" placeholder="Ingredientes o detalles del plato" required>
                        </div>

                        <div class="mb-3">
                            <label for="imagenPlato" class="form-label text-grafito fw-bold">Imagen</label>
                            <input type="file" id="imagenPlato" class="form-control custom-input">
                        </div>

                        <button type="submit" class="submit-btn mt-4">Guardar Plato</button>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="custom-footer mt-auto">
        <p class="m-0">© 2026 Restaurante Escolar Edu Food. Todos los derechos reservados.</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
