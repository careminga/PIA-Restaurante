<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configuración de Perfil - Edu Food</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/css/configuracionusuario.css">
    <link rel="stylesheet" href="../css/navbar.css">
</head>
<body class="dashboard-grid">

    <header class="edu-header">
        <nav class="navbar navbar-expand-lg edu-navbar" aria-label="Navegación principal">
            <div class="container">
                <a class="navbar-brand edu-brand" href="./inusuario.html">Edu Food</a>
    
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                    data-bs-target="#navbarNav" aria-controls="navbarNav"
                    aria-expanded="false" aria-label="Abrir menú">
                    <span class="navbar-toggler-icon"></span>
                </button>
    
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav ms-auto align-items-lg-center">
                        <li class="nav-item">
                            <a class="nav-link" href="./inusuario.html">Inicio</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="./paginadeplatosusuario.html">Platos</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="./refrigeriousuario.html">Refrigerios</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="./acercadenosotros.html">Acerca de nosotros</a>
                        </li>
                        <li class="nav-item">
                            <a class="profile-icon" href="./configuracionusuario.html" aria-label="Mi perfil">
                                <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" fill="currentColor"
                                    class="bi bi-person-circle" viewBox="0 0 16 16" aria-hidden="true">
                                    <path d="M11 6a3 3 0 1 1-6 0 3 3 0 0 1 6 0"/>
                                    <path fill-rule="evenodd" d="M0 8a8 8 0 1 1 16 0A8 8 0 0 1 0 8m8-7a7 7 0 0 0-5.468 11.37C3.242 11.226 4.805 10 8 10s4.757 1.225 5.468 2.37A7 7 0 0 0 8 1"/>
                                </svg>
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link edu-salir" href="../index.html"
                                onclick="sessionStorage.removeItem('userRole')">Salir</a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>


    <main class="main-content bg-light-purple">
        <section class="content-header bg-white px-4 py-3 shadow-sm">
            <h4 class="mb-0 fw-600 text-grafito">Configuración de Cuenta</h4>
        </section>

        <section class="container-fluid p-4">
            <div class="row justify-content-center">
                <div class="col-12 col-xl-10">
                    
                    <div class="row g-4">
                     
                        <aside class="col-12 col-lg-4">
                            <article class="card border-0 shadow-sm rounded-4 p-4 text-center h-100">
                                <div class="position-relative d-inline-block mx-auto mb-3">
                                    <img src="usu.jpg" alt="Foto de perfil" class="rounded-circle img-thumbnail shadow-sm" style="width: 150px; height: 150px; object-fit: cover;">
                                    <label for="file-input" class="btn-edit-img shadow">
                                        <i class="bi bi-pencil-fill"></i>
                                    </label>
                                    <input id="file-input" type="file" hidden />
                                </div>
                                <h5 class="fw-bold text-grafito mb-1"> Juanito Felipe Pérez</h5>
                                <p class="text-muted small">ID: EST-2026-04</p>
                                <hr class="my-3 opacity-10">
                                <div class="text-start small">
                                    <p class="mb-1"><strong>Grado:</strong> 11</p>
                                    <p class="mb-0"><strong>Estado:</strong> Activo</p>
                                </div>
                            </article>
                        </aside>

                      
                        <article class="col-12 col-lg-8">
                            <section class="card border-0 shadow-sm rounded-4 p-4">
                                <h5 class="fw-bold text-grafito mb-4 border-bottom pb-2">Información Personal</h5>
                                
                                <form class="row g-3">
                                    <div class="col-md-6">
                                        <label class="form-label small fw-bold">Nombre</label>
                                        <input type="text" class="form-control" value="Juanito">
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label small fw-bold">Apellido</label>
                                        <input type="text" class="form-control" value="Pérez">
                                    </div>
                                    <div class="col-12">
                                        <label class="form-label small fw-bold">Correo Institucional</label>
                                        <input type="email" class="form-control" value="juanito.perez@colegio.edu.co" disabled>
                                        <div class="form-text">El correo no puede ser modificado.</div>
                                    </div>
                                    
                                    <h5 class="fw-bold text-grafito mt-5 mb-3 border-bottom pb-2">Seguridad</h5>
                                    
                                    <div class="col-md-6">
                                        <label class="form-label small fw-bold">Nueva Contraseña</label>
                                        <input type="password" class="form-control" placeholder="••••••••">
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label small fw-bold">Confirmar Contraseña</label>
                                        <input type="password" class="form-control" placeholder="••••••••">
                                    </div>

                                    <div class="col-12 text-end mt-4">
                                        <button type="submit" class="btn btn-grafito px-4 py-2 fw-bold">
                                            Guardar Cambios
                                        </button>
                                    </div>
                                </form>
                            </section>
                        </article>
                    </div>

                </div>
            </div>
        </section>
    </main>

</body>
</html>
