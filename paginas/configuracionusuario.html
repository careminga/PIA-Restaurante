<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configuración de Perfil - Edu Food</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/css/configuracionusuario.css">
</head>
<body class="dashboard-grid">

    
    <aside class="sidebar bg-grafito text-white">
        <header class="sidebar-header">
            <span class="fs-4 fw-bold text-uppercase">Edu Food</span>
        </header>
        <nav class="sidebar-nav">
            <a href="inusuario.html" class="nav-link"><i class="bi bi-house-door"></i> Inicio</a>
            <a href="configuracionusuario.html" class="nav-link active"><i class="bi bi-person-gear"></i> Mi Perfil</a>
            <a href="../index.html" class="nav-link logout mt-auto"><i class="bi bi-box-arrow-left"></i> Salir</a>
        </nav>
    </aside>


    <main class="main-content bg-light-purple">
        <header class="content-header bg-white px-4 py-3 shadow-sm">
            <h4 class="mb-0 fw-600 text-grafito">Configuración de Cuenta</h4>
        </header>

        <section class="container-fluid p-4">
            <div class="row justify-content-center">
                <div class="col-12 col-xl-10">
                    
                    <div class="row g-4">
                     
                        <aside class="col-12 col-lg-4">
                            <article class="card border-0 shadow-sm rounded-4 p-4 text-center h-100">
                                <div class="position-relative d-inline-block mx-auto mb-3">
                                    <img src="usu.jpg" alt="Foto de perfil" class="rounded-circle img-thumbnail shadow-sm" style="width: 150px; height: 150px; object-fit: cover;">
                                    <label for="file-input" class="btn-edit-img shadow">
                                        <i class="bi bi-pencil-fill"></i>
                                    </label>
                                    <input id="file-input" type="file" hidden />
                                </div>
                                <h5 class="fw-bold text-grafito mb-1"> Juanito Felipe Pérez</h5>
                                <p class="text-muted small">ID: EST-2026-04</p>
                                <hr class="my-3 opacity-10">
                                <div class="text-start small">
                                    <p class="mb-1"><strong>Grado:</strong> 11</p>
                                    <p class="mb-0"><strong>Estado:</strong> Activo</p>
                                </div>
                            </article>
                        </aside>

                      
                        <article class="col-12 col-lg-8">
                            <section class="card border-0 shadow-sm rounded-4 p-4">
                                <h5 class="fw-bold text-grafito mb-4 border-bottom pb-2">Información Personal</h5>
                                
                                <form class="row g-3">
                                    <div class="col-md-6">
                                        <label class="form-label small fw-bold">Nombre</label>
                                        <input type="text" class="form-control" value="Juanito">
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label small fw-bold">Apellido</label>
                                        <input type="text" class="form-control" value="Pérez">
                                    </div>
                                    <div class="col-12">
                                        <label class="form-label small fw-bold">Correo Institucional</label>
                                        <input type="email" class="form-control" value="juanito.perez@colegio.edu.co" disabled>
                                        <div class="form-text">El correo no puede ser modificado.</div>
                                    </div>
                                    
                                    <h5 class="fw-bold text-grafito mt-5 mb-3 border-bottom pb-2">Seguridad</h5>
                                    
                                    <div class="col-md-6">
                                        <label class="form-label small fw-bold">Nueva Contraseña</label>
                                        <input type="password" class="form-control" placeholder="••••••••">
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label small fw-bold">Confirmar Contraseña</label>
                                        <input type="password" class="form-control" placeholder="••••••••">
                                    </div>

                                    <div class="col-12 text-end mt-4">
                                        <button type="submit" class="btn btn-grafito px-4 py-2 fw-bold">
                                            Guardar Cambios
                                        </button>
                                    </div>
                                </form>
                            </section>
                        </article>
                    </div>

                </div>
            </div>
        </section>
    </main>

</body>
</html>
