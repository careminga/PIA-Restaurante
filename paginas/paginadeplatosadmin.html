<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edu Food - Administrar Platos</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/styles.css">

    <style>
        .plate-container {
            max-width: 1000px;
            margin: 0 auto;
        }
        .preview-img {
            width: 100%;
            height: 140px;
            object-fit: cover;
            border-radius: 0.5rem;
        }
    </style>
</head>

<body class="bg-light-purple d-flex flex-column min-vh-100">

    <!-- Barra de Navegación Administrador -->
    <header>
        <nav class="navbar navbar-expand-lg">
            <div class="container-fluid">
                <h1 class="text-white ms-3 mb-0 fs-3">Edu Food</h1>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <div class="navbar-nav ms-auto links-navinad align-items-center gap-3">
                        <a class="nav-link text-white active" href="./inadministrador.html">Inicio</a>
                        <a class="nav-link text-white" href="./refrigerioadmin.html">Modificar refrigerios</a>
                        <a class="nav-link text-white" href="./listausuarios.html">lista de usuarios</a>
                        <a class="nav-link text-white" href="./acercadenosotrosadmin.html">Acerca de nosotros</a>
                        <!-- Icono de perfil de administrador -->
                        <a href="./configuracionadmin.html" class="profile-icon text-white">
                            <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" fill="currentColor"
                                class="bi bi-person-circle" viewBox="0 0 16 16">
                                <path d="M11 6a3 3 0 1 1-6 0 3 3 0 0 1 6 0" />
                                <path fill-rule="evenodd"
                                    d="M0 8a8 8 0 1 1 16 0A8 8 0 0 1 0 8m8-7a7 7 0 0 0-5.468 11.37C3.242 11.226 4.805 10 8 10s4.757 1.225 5.468 2.37A7 7 0 0 0 8 1" />
                            </svg>
                        </a>
                    </div>
                </div>
            </div>
        </nav>
    </header>

    <!-- Contenido Principal -->
    <main class="container my-5 flex-grow-1">
        <div class="main-card p-4 p-md-5 plate-container">
            
            <!-- Encabezado -->
            <div class="mb-4">
                <h2 class="fw-bold text-grafito m-0">Añadir Nuevo Plato o Refrigerio</h2>
                <p class="text-muted small mt-1">Registra un nuevo plato o refrigerio saludable para el menú escolar. Completa toda la información correctamente.</p>
            </div>

            <div class="row g-4 align-items-center">
                <!-- Columna Izquierda: Formulario -->
                <div class="col-md-6">
                    <form>
                        <div class="row g-3 mb-3">
                            <div class="col-6">
                                <label class="form-label text-grafito fw-bold small">Nombre del plato</label>
                                <input type="text" class="form-control custom-input" placeholder="Ej: Hamburguesa saludable">
                            </div>
                            <div class="col-6">
                                <label class="form-label text-grafito fw-bold small">Categoría</label>
                                <select class="form-select custom-input">
                                    <option selected>Seleccionar</option>
                                    <option value="1">Plato Principal</option>
                                    <option value="2">Refrigerio</option>
                                </select>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label text-grafito fw-bold small">Descripción</label>
                            <textarea class="form-control custom-input" rows="3" placeholder="Describe el plato..."></textarea>
                        </div>

                        <div class="row g-2 mb-3">
                            <div class="col-4">
                                <label class="form-label text-grafito fw-bold small">Calorías</label>
                                <input type="text" class="form-control custom-input" placeholder="320">
                            </div>
                            <div class="col-4">
                                <label class="form-label text-grafito fw-bold small">Proteínas</label>
                                <input type="text" class="form-control custom-input" placeholder="25g">
                            </div>
                            <div class="col-4">
                                <label class="form-label text-grafito fw-bold small">Grasas</label>
                                <input type="text" class="form-control custom-input" placeholder="10g">
                            </div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label text-grafito fw-bold small">Imagen del plato</label>
                            <input type="file" class="form-control custom-input">
                        </div>

                        <button type="submit" class="submit-btn">Guardar Plato</button>
                    </form>
                </div>

                <!-- Columna Derecha: Cuadrícula de 4 imágenes -->
                <div class="col-md-6">
                    <div class="row g-3">
                        <div class="col-6">
                            <div class="food-card shadow-sm h-100 p-2">
                                <img src="https://images.unsplash.com/photo-1568901346375-23c9450c58cd?auto=format&fit=crop&w=400&q=80" alt="Plato 1" class="preview-img">
                            </div>
                        </div>
                        <div class="col-6">
                            <div class="food-card shadow-sm h-100 p-2">
                                <img src="https://images.unsplash.com/photo-1512621776951-a57141f2eefd?auto=format&fit=crop&w=400&q=80" alt="Plato 2" class="preview-img">
                            </div>
                        </div>
                        <div class="col-6">
                            <div class="food-card shadow-sm h-100 p-2">
                                <img src="https://images.unsplash.com/photo-1546069901-ba9599a7e63c?auto=format&fit=crop&w=400&q=80" alt="Plato 3" class="preview-img">
                            </div>
                        </div>
                        <div class="col-6">
                            <div class="food-card shadow-sm h-100 p-2">
                                <img src="https://images.unsplash.com/photo-1490645935967-10de6ba17061?auto=format&fit=crop&w=400&q=80" alt="Plato 4" class="preview-img">
                            </div>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </main>

    <!-- Footer -->
    <footer class="custom-footer">
        <p class="m-0">© 2026 Restaurante Escolar Edu Food. Todos los derechos reservados.</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
